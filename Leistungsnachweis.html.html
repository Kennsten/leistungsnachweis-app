<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leistungsnachweis</title>

  <style>
    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:#d9dee3;
      color:#111;
      font-family:Arial,Helvetica,sans-serif;
    }

    .toolbar{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      background:#fff;
      border-bottom:1px solid #bbb;
    }

    .toolbar-title{
      font-size:17px;
      font-weight:700;
    }

    .toolbar-actions{
      display:flex;
      gap:10px;
    }

    button{
      appearance:none;
      border:1px solid #9eb2c5;
      border-radius:10px;
      padding:10px 16px;
      background:#eef5fb;
      color:#18344e;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    }

    button.primary{
      background:#173b5b;
      border-color:#173b5b;
      color:#fff;
    }

    .page-wrap{
      width:100%;
      overflow:auto;
      padding:20px;
    }

    .sheet{
      width:1180px;
      min-height:790px;
      margin:0 auto;
      padding:18px 22px 15px;
      background:#fff;
      border:1px solid #777;
      box-shadow:0 6px 24px rgba(0,0,0,.16);
      font-size:10px;
      line-height:1.12;
    }

    .topline{
      display:grid;
      grid-template-columns:18% 82%;
      min-height:24px;
      border:1px solid #666;
      border-bottom:0;
    }

    .topline > div{
      padding:4px 5px;
      border-right:1px solid #666;
    }

    .topline > div:last-child{
      border-right:0;
    }

    .top-title{
      font-weight:400;
    }

    .top-description{
      white-space:nowrap;
      overflow:hidden;
    }

    .assist-row{
      height:24px;
      display:flex;
      align-items:center;
      padding:4px 5px;
      border:1px solid #666;
      border-bottom:0;
      font-size:12px;
      font-weight:700;
    }

    .header-grid{
      width:100%;
      border-left:1px solid #666;
      border-top:1px solid #666;
    }

    .header-row{
      display:grid;
      min-height:25px;
      border-bottom:1px solid #666;
    }

    .header-row > div{
      display:flex;
      align-items:center;
      padding:4px 5px;
      border-right:1px solid #666;
      overflow:hidden;
    }

    .person-row{
      grid-template-columns:37% 35% 14% 14%;
    }

    .simple-row{
      grid-template-columns:37% 63%;
    }

    .budget-row{
      grid-template-columns:37% 12% 15% 10% 13% 13%;
    }

    .budget-row-2{
      grid-template-columns:37% 12% 15% 10% 13% 13%;
    }

    .budget-row-3{
      grid-template-columns:37% 12% 15% 10% 13% 13%;
    }

    .label{
      font-weight:700;
    }

    .value{
      background:#fff4eb;
    }

    .value.blue{
      background:#dff2f8;
    }

    .center{
      justify-content:center;
      text-align:center;
    }

    .month-row{
      display:grid;
      grid-template-columns:5% 8% 20% 67%;
      min-height:26px;
      border-left:1px solid #666;
      border-right:1px solid #666;
      border-bottom:1px solid #666;
    }

    .month-row > div{
      display:flex;
      align-items:center;
      padding:4px 5px;
      border-right:1px solid #666;
    }

    .month-row > div:last-child{
      border-right:0;
    }

    .ln-table{
      width:100%;
      table-layout:fixed;
      border-collapse:collapse;
      font-size:9px;
    }

    .ln-table th,
    .ln-table td{
      border:1px solid #666;
      padding:2px 3px;
      vertical-align:middle;
      overflow:hidden;
    }

    .ln-table thead th{
      height:66px;
      text-align:center;
      font-weight:700;
      vertical-align:bottom;
      line-height:1.15;
    }

    .ln-table tbody td{
      height:19px;
    }

    .ln-table tbody tr:nth-child(even) td{
      background:#fff4eb;
    }

    .ln-table tfoot th,
    .ln-table tfoot td{
      height:24px;
      font-weight:700;
    }

    .c-date{width:5%}
    .c-time{width:7%}
    .c-place{width:26%}
    .c-min{width:12%}
    .c-fls{width:14%}
    .c-way1{width:8%}
    .c-way2{width:11%}
    .c-cancel{width:7%}
    .c-code{width:10%}
    .c-worker{width:20%}

    .number{
      text-align:right;
      white-space:nowrap;
    }

    .center-text{
      text-align:center;
    }

    .sum-labels{
      display:grid;
      grid-template-columns:38% 12% 14% 8% 11% 7% 10%;
      border-left:1px solid #666;
      border-right:1px solid #666;
      border-bottom:1px solid #666;
      min-height:48px;
    }

    .sum-labels > div{
      padding:5px 4px;
      border-right:1px solid #666;
    }

    .sum-labels > div:last-child{
      border-right:0;
    }

    .signature-area{
      margin-top:24px;
      display:grid;
      grid-template-columns:10% 74% 16%;
      row-gap:4px;
      font-size:9px;
    }

    .signature-area .line{
      min-height:24px;
      border-bottom:1px solid #666;
    }

    .confirmation{
      grid-column:2 / 4;
      padding-top:2px;
    }

    .error-box{
      width:min(90vw,700px);
      margin:60px auto;
      padding:25px;
      border-radius:14px;
      background:#fff;
      border:1px solid #c7d0d8;
      box-shadow:0 6px 24px rgba(0,0,0,.12);
    }

    @media print{
      html,body{
        width:297mm;
        height:210mm;
        margin:0;
        padding:0;
        background:#fff;
      }

      .toolbar{display:none}

      .page-wrap{
        width:297mm;
        height:210mm;
        margin:0;
        padding:0;
        overflow:visible;
      }

      .sheet{
        width:297mm;
        height:210mm;
        min-height:210mm;
        margin:0;
        padding:5mm 7mm 4mm;
        border:0;
        box-shadow:none;
        font-size:7.5pt;
      }

      .topline{min-height:5mm}
      .assist-row{height:5mm}
      .header-row{min-height:5mm}
      .month-row{min-height:5mm}

      .ln-table{
        font-size:6.4pt;
      }

      .ln-table thead th{
        height:22mm;
      }

      .ln-table tbody td{
        height:4.2mm;
      }

      .ln-table tfoot th,
      .ln-table tfoot td{
        height:5mm;
      }

      .sum-labels{
        min-height:12mm;
      }

      .signature-area{
        margin-top:5mm;
      }

      @page{
        size:A4 landscape;
        margin:0;
      }
    }
  </style>
</head>

<body>
  <div class="toolbar">
    <div class="toolbar-title">Leistungsnachweis</div>

    <div class="toolbar-actions">
      <button type="button" id="closeButton">Schließen</button>
      <button type="button" id="printButton" class="primary">Drucken / PDF</button>
    </div>
  </div>

  <main id="app"></main>

  <script>
    const app=document.getElementById('app');

    function esc(value){
      return String(value??'')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function formatFls(value){
      const number=Number(value||0);
      return number.toLocaleString(
        'de-DE',
        {minimumFractionDigits:2,maximumFractionDigits:2}
      );
    }

    function formatDate(value){
      if(!value)return '';
      const parts=String(value).split('-');
      if(parts.length!==3)return value;
      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function minutesToFls(minutes){
      return Math.round((Number(minutes||0)/50)*100)/100;
    }

    function readPayload(){
      const raw=sessionStorage.getItem('leistungsnachweis_payload');
      if(!raw)return null;

      try{
        return JSON.parse(raw);
      }catch(error){
        console.error(error);
        return null;
      }
    }

    function showError(){
      app.innerHTML=`
        <div class="error-box">
          <h2>Keine Daten gefunden</h2>
          <p>Öffne den Leistungsnachweis bitte über die Klienten-App.</p>
        </div>
      `;
    }

    function render(){
      const payload=readPayload();

      if(!payload){
        showError();
        return;
      }

      const client=payload.client||{};
      const approval=payload.approval||{};
      const entries=payload.entries||[];
      const monthLabel=payload.monthLabel||'';

      const totalMinutes=entries.reduce(
        (sum,entry)=>sum+Number(entry.dauer_minuten||0),
        0
      );

      const totalFls=minutesToFls(totalMinutes);
      const totalWay=entries.reduce(
        (sum,entry)=>sum+Number(entry.wegepauschale_betrag||0),
        0
      );
      const totalCancel=entries.reduce(
        (sum,entry)=>sum+Number(entry.ausfallstunde||0),
        0
      );

      const rows=[];

      for(let index=0;index<22;index++){
        const entry=entries[index];

        if(entry){
          rows.push(`
            <tr>
              <td>${esc(formatDate(entry.datum))}</td>
              <td>${esc(String(entry.beginn||'').slice(0,5))} – ${esc(String(entry.ende||'').slice(0,5))}</td>
              <td>${esc(entry.ort_der_leistung||'')}</td>
              <td class="number">${Number(entry.dauer_minuten||0)}</td>
              <td class="number">${formatFls(minutesToFls(entry.dauer_minuten))}</td>
              <td class="center-text">${entry.wegepauschale?1:''}</td>
              <td class="number">${entry.wegepauschale_betrag?formatFls(entry.wegepauschale_betrag):'0,00'}</td>
              <td class="center-text">${entry.ausfallstunde?1:''}</td>
              <td>${esc(entry.kennziffer||'')}</td>
              <td>${esc(payload.auftragnehmer||'Stork, Oliver')}</td>
            </tr>
          `);
        }else{
          rows.push(`
            <tr>
              <td>&nbsp;</td>
              <td></td>
              <td></td>
              <td></td>
              <td class="number">0,00</td>
              <td></td>
              <td class="number">0,00</td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          `);
        }
      }

      const provider=
        approval.kostentraeger ||
        approval.leistungstraeger_name ||
        approval.leistungstraeger_typ ||
        '';

      const approvalStart=approval.beginn?formatDate(approval.beginn):'';
      const approvalEnd=approval.ende?formatDate(approval.ende):'';
      const approvalPeriod=
        approvalStart||approvalEnd
          ? `${approvalStart} – ${approvalEnd}`
          : '';

      app.innerHTML=`
        <div class="page-wrap">
          <section class="sheet">

            <div class="topline">
              <div class="top-title">Leistungsnachweis</div>
              <div class="top-description">
                Assistenz beim Wohnen außerhalb der besonderen Wohnform i.S.d. § 42a Abs. 2 Nr. 2 SGB XII Monatsabrechnung
              </div>
            </div>

            <div class="assist-row">Qualifizierte Assistenz</div>

            <section class="header-grid">
              <div class="header-row person-row">
                <div class="label">Leistungsberechtigte Person (LP): (Name, Vorname)</div>
                <div class="value">${esc(client.name||'')}</div>
                <div class="label">Aktenzeichen:</div>
                <div class="value">${esc(client.aktenzeichen||'')}</div>
              </div>

              <div class="header-row simple-row">
                <div class="label">Leistungsanbieter (Name, Adresse)</div>
                <div class="value">${esc(payload.leistungsanbieter||'SuPA GmbH Königstraße 6, 30175 Hannover')}</div>
              </div>

              <div class="header-row simple-row">
                <div class="label">Verantwortliche*r Auftragnehmer*in (Name, Vorname)</div>
                <div class="value">${esc(payload.auftragnehmer||'Stork, Oliver')}</div>
              </div>

              <div class="header-row simple-row">
                <div class="label">Zuständiger örtlicher Leistungsträger</div>
                <div class="value">${esc(provider)}</div>
              </div>

              <div class="header-row budget-row">
                <div class="label">Anzahl der bewilligten Fachleistungsstunden (FLS)/ Woche</div>
                <div class="value center">${approval.wochen_fls!=null?formatFls(approval.wochen_fls):''}</div>
                <div class="label center">Zusatzkontingent (ZK)</div>
                <div class="value blue center">0</div>
                <div class="label center">Zeitraum ZK</div>
                <div class="value blue center"></div>
              </div>

              <div class="header-row budget-row-2">
                <div class="label">Beginn 12 Monatszeitraum</div>
                <div class="value center">${esc(approvalPeriod)}</div>
                <div class="label center">Anzahl Monate ZK</div>
                <div class="value blue center">0</div>
                <div class="label center">ZK/Monat</div>
                <div class="value blue center">0,00</div>
              </div>

              <div class="header-row budget-row-3">
                <div class="label">Gesamtbudget</div>
                <div class="value center">${approval.stundenkontingent!=null?formatFls(approval.stundenkontingent):''}</div>
                <div class="label center">Restbudget Monat</div>
                <div class="value center"></div>
                <div></div>
                <div></div>
              </div>
            </section>

            <div class="month-row">
              <div class="label">Monat:</div>
              <div class="value center">${esc(monthLabel.split(' ')[0]||'')}</div>
              <div class="value center">${esc(monthLabel.split(' ')[1]||'')}</div>
              <div></div>
            </div>

            <table class="ln-table">
              <colgroup>
                <col class="c-date">
                <col class="c-time">
                <col class="c-place">
                <col class="c-min">
                <col class="c-fls">
                <col class="c-way1">
                <col class="c-way2">
                <col class="c-cancel">
                <col class="c-code">
                <col class="c-worker">
              </colgroup>

              <thead>
                <tr>
                  <th>Datum</th>
                  <th>Uhrzeit</th>
                  <th>Ort der Leistung</th>
                  <th>Dauer in Minuten<br>direkt mit der LP</th>
                  <th>
                    Anzahl direkte FLS<br>
                    qualifizierte Assistenzkraft.<br>
                    Eine FLS ist definiert als 50 Minuten mit der LP
                  </th>
                  <th>Wege-<br>pauschale ja=1</th>
                  <th>abzurechnende<br>Wegepauschale</th>
                  <th>davon<br>"Ausfallstunden"<br>Ja=1</th>
                  <th>Kennziffer für<br>Kurzbeschreibung</th>
                  <th>Auftragnehmer*in<br>(Name in Klartext)</th>
                </tr>
              </thead>

              <tbody>${rows.join('')}</tbody>

              <tfoot>
                <tr>
                  <td colspan="3">Gesamt</td>
                  <td class="number">${totalMinutes.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                  <td class="number">${formatFls(totalFls)}</td>
                  <td></td>
                  <td class="number">${formatFls(totalWay)}</td>
                  <td class="center-text">${totalCancel}</td>
                  <td></td>
                  <td></td>
                </tr>
              </tfoot>
            </table>

            <div class="sum-labels">
              <div></div>
              <div>Summe Minuten</div>
              <div>Summe FLS</div>
              <div></div>
              <div>Summe Wegepauschalen</div>
              <div>Summe Ausfallstunden</div>
              <div></div>
            </div>

            <div class="signature-area">
              <div>Datum</div>
              <div class="line"></div>
              <div></div>

              <div></div>
              <div>Unterschrift der leistungsberechtigten Person</div>
              <div></div>

              <div></div>
              <div class="confirmation">
                Mit der Unterschrift bestätigt die leistungsberechtigte Person die aufgeführten Leistungen in Minuten (incl. Ausfallzeiten) erhalten zu haben.
              </div>
              <div></div>
            </div>

          </section>
        </div>
      `;
    }

    document.getElementById('printButton').addEventListener('click',()=>window.print());
    document.getElementById('closeButton').addEventListener('click',()=>window.close());

    render();
  </script>
</body>
</html>

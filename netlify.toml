# Veröffentlichung: Bei jedem Speichern auf GitHub lädt Netlify die Bibliotheken
# (siehe package.json) und legt sie in den Ordner lib/. So lädt die App nichts
# mehr von fremden Servern und funktioniert ohne Internet.
# Vor dem Veröffentlichen läuft die Prüfung scripts/pruefen.mjs (Sicherung gegen
# versehentlich gelöschte Teile). Schlägt sie fehl, bleibt die bisherige Version online.
[build]
  publish = "."
  command = "node scripts/pruefen.mjs && npm install --no-audit --no-fund && node scripts/bibliotheken-kopieren.mjs && node scripts/stand-setzen.mjs && rm -rf node_modules"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Der Service Worker muss immer frisch geprüft werden, sonst kommen Updates nicht an.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# App-eigene Bausteine ebenfalls immer frisch prüfen
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Kartenpakete für die Kilometer-Berechnung auf dem Gerät: unverändert ausliefern
# (die App entpackt sie selbst) und bei jedem Laden auf neuere Fassungen prüfen.
[[headers]]
  for = "/karten/*"
  [headers.values]
    Cache-Control = "no-cache"

# Sicherheits-Kopfzeilen für die ganze App.
# - Die Seite darf nicht in fremde Seiten eingebettet werden (Clickjacking).
# - Verbindungen gehen nur an den eigenen Server, Supabase (Frankfurt) und pCloud.
# - Skripte und Bilder nur von der eigenen Adresse (die Karte zeichnet die App selbst).
# 'unsafe-inline' bei Skripten ist nötig, weil die Seiten noch eingebaute Skripte
# enthalten; 'wasm-unsafe-eval' braucht die Passwort-Ableitung (Argon2).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.pcloud.com; font-src 'self' data:; connect-src 'self' blob: data: https://luizzjsxufsezgpjypwx.supabase.co wss://luizzjsxufsezgpjypwx.supabase.co https://*.pcloud.com https://huggingface.co https://*.huggingface.co https://*.hf.co; media-src 'self' blob: data:; object-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"

# Diktat-Bausteine: richtige Dateiarten, damit der Browser sie als Programm bzw. Rechenkern lädt
[[headers]]
  for = "/lib/diktat/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/lib/diktat/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leistungsnachweis</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    @page{
      size:A4 landscape;
      margin:0;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:#d9dee3;
      color:#111;
      font-family:Arial,Helvetica,sans-serif;
    }

    .toolbar{
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 16px;
      background:#fff;
      border-bottom:1px solid #bbb;
    }

    .toolbar-title{
      font-size:17px;
      font-weight:700;
    }

    .toolbar-actions{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
    }

    button{
      appearance:none;
      border:1px solid #9eb2c5;
      border-radius:10px;
      padding:10px 16px;
      background:#eef5fb;
      color:#18344e;
      font-size:15px;
      font-weight:600;
      cursor:pointer;
    }

    button.primary{
      background:#173b5b;
      border-color:#173b5b;
      color:#fff;
    }

    .page-wrap{
      width:100%;
      overflow:auto;
      padding:20px;
    }

    .sheet{
      width:1280px;
      margin:0 auto;
      padding:18px 22px 15px;
      background:#fff;
      border:1px solid #777;
      box-shadow:0 6px 24px rgba(0,0,0,.16);
      font-size:10px;
      line-height:1.12;
    }

    .form-head,
    .ln-table{
      width:100%;
      table-layout:fixed;
      border-collapse:collapse;
      margin:0;
      break-inside:auto;
      page-break-inside:auto;
    }

    .form-head{
      font-size:10px;
      line-height:1.1;
    }

    .form-head td{
      height:20px;
      padding:2px 5px;
      border:1px solid #666;
      vertical-align:middle;
      overflow:hidden;
    }

    .head-label{
      font-weight:700;
      text-align:left;
    }

    .head-value{
      background:#fff4eb;
      text-align:left;
      font-weight:400;
    }

    .head-value-number{
      background:#fff4eb;
      text-align:right;
      font-weight:400;
    }

    .head-zk-label{
      font-weight:700;
      text-align:center;
    }

    .head-zk-value{
      background:#dff2f8;
      text-align:center;
      font-weight:400;
    }

    .head-title{
      font-weight:400;
      text-align:left;
    }

    .head-description{
      font-weight:400;
      text-align:left;
      white-space:nowrap;
    }

    .head-assist{
      font-size:11px;
      font-weight:700;
      text-align:left;
    }

    .head-month-label{
      font-weight:700;
      text-align:left;
    }

    .head-spacer td{
      height:4px;
      padding:0;
      background:#fff;
    }

    .head-month-value{
      background:#fff4eb;
      text-align:center;
      font-weight:400;
    }

    .ln-table{
      margin-top:-1px;
      font-size:9px;
    }

    .ln-table th,
    .ln-table td{
      border:1px solid #666;
      padding:2px 4px;
      vertical-align:middle;
      overflow:hidden;
    }

    .ln-table thead th{
      height:74px;
      text-align:center;
      font-weight:700;
      vertical-align:bottom;
      line-height:1.15;
      font-size:8.5px;
    }

    .ln-table tbody td{
      height:20px;
      font-size:9px;
    }

    .ln-table tbody tr:nth-child(even) td{
      background:#fff4eb;
    }

    .ln-table tfoot th,
    .ln-table tfoot td{
      height:24px;
      font-weight:700;
    }

    .c-date{width:5%}
    .c-time{width:8%}
    .c-place{width:23%}
    .c-min{width:8%}
    .c-fls{width:10%}
    .c-way1{width:6%}
    .c-way2{width:9%}
    .c-cancel{width:6%}

    .c-worker{width:16%}

      white-space:nowrap;

      padding-top:2px;

    .error-box{

      border-radius:14px;
      background:#fff;

      box-shadow:0 6px 24px rgba(0,0,0,.12);

    @media print{

        height:auto;
        margin:0;
        padding:0;

  <main id="app"></main>

  <script>
    const app=document.getElementById('app');

    function esc(value){
      return String(value??'')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function formatFls(value){
      const number=Number(value||0);
      return number.toLocaleString(
        'de-DE',
        {minimumFractionDigits:2,maximumFractionDigits:2}
      );
    }

    function formatDate(value){
      if(!value)return '';
      const parts=String(value).split('-');
      if(parts.length!==3)return value;
      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    const FLS_VIERTEL_BIS='2026-06-30';

    function eintragFls(entry){
      if(!entry)return 0;

      if(entry.fls!=null&&entry.fls!==''){
        return Number(entry.fls);
      }

      const roh=Number(entry.dauer_minuten||0)/50;
      const tag=String(entry.datum||'').slice(0,10);

      return tag&&tag<=FLS_VIERTEL_BIS
        ? Math.round(roh*4)/4
        : Math.round(roh*100)/100;
    }

    function summeFls(liste){
      return Math.round(
        (liste||[]).reduce((summe,e)=>summe+eintragFls(e),0)*100
      )/100;
    }

    function istAusfall(entry){
      return String(entry&&entry.leistungsart||'')
        .trim()
        .toLowerCase()
        .startsWith('ausfall');
    }

    function hatWegepauschale(entry){
      const ort=String(entry&&entry.ort_der_leistung||'')
        .trim()
        .toLowerCase();

      if(ort==='telefon'||ort==='online')return false;

      const art=String(entry&&entry.leistungsart||'')
        .trim()
        .toLowerCase();

      if(art==='ausfall ohne fahrt')return false;

      return true;
    }

    function minutesToFls(minutes){
      return Math.round((Number(minutes||0)/50)*100)/100;
    }

    function readPayload(){
      const raw=sessionStorage.getItem('leistungsnachweis_payload');
      if(!raw)return null;

      try{
        return JSON.parse(raw);
      }catch(error){
        console.error(error);
        return null;
      }
    }

    function showError(){
      app.innerHTML=`
        <div class="error-box">
          <h2>Keine Daten gefunden</h2>
          <p>Öffne den Leistungsnachweis bitte über die Klienten-App.</p>
        </div>
      `;
    }

    function render(){
      const payload=readPayload();

      if(!payload){
        showError();
        return;
      }

      const client=payload.client||{};
      const approval=payload.approval||{};
      const entries=payload.entries||[];
      const monthLabel=payload.monthLabel||'';

      const totalMinutes=entries.reduce(
        (sum,entry)=>sum+Number(entry.dauer_minuten||0),
        0
      );

      const totalFls=summeFls(entries);
const totalWay=entries.reduce(
  (sum,entry)=>sum+(hatWegepauschale(entry)?1:0),
  0
);
      const totalCancel=entries.reduce(
        (sum,entry)=>sum+(istAusfall(entry)?1:0),
        0
      );

      const rows=[];

      for(let index=0;index<22;index++){
        const entry=entries[index];

        if(entry){
          rows.push(`
            <tr>
              <td>${esc(formatDate(entry.datum))}</td>
              <td>${esc(String(entry.beginn||'').slice(0,5))} – ${esc(String(entry.ende||'').slice(0,5))}</td>
              <td>${esc(entry.ort_der_leistung||'')}</td>
              <td class="number">${Number(entry.dauer_minuten||0)}</td>
              <td class="number">${formatFls(eintragFls(entry))}</td>
<td class="center-text">${hatWegepauschale(entry)?1:''}</td>
<td class="number">${hatWegepauschale(entry)?'1,00':'0,00'}</td>
              <td class="center-text">${istAusfall(entry)?1:''}</td>
              <td>${esc(entry.kennziffer||'')}</td>
              <td>${esc(payload.auftragnehmer||'')}</td>
            </tr>
          `);
        }else{
          rows.push(`
            <tr>
              <td>&nbsp;</td>
              <td></td>
              <td></td>
              <td></td>
              <td class="number">0,00</td>
              <td></td>
              <td class="number">0,00</td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          `);
        }
      }

      const provider=
        approval.kostentraeger ||
        approval.leistungstraeger_name ||
        approval.leistungstraeger_typ ||
        '';

      const approvalPeriod=approval.beginn
  ? new Date(
      approval.beginn+'T00:00:00'
    ).toLocaleDateString(
      'de-DE',
      {
        month:'long',
        year:'numeric'
      }
    )
  : '';

      const weeklyFls=
        approval.wochen_fls ??
        approval.fls_pro_woche ??
        approval.wochenstunden ??

      const totalBudget=
        payload.totalBudget ??
        approval.stundenkontingent ??
        approval.gesamt_fls ??
        approval.gesamtbudget ??

      const monthlyBudget=
        payload.monthlyBudget ??

          ? Math.round((Number(weeklyFls)*4.3)*100)/100
          : '');

      const monthlyRestBudget=
        payload.monthlyRestBudget ??

          ? Math.round(
              (Number(monthlyBudget)-totalFls)*100
            )/100
          : '');

      app.innerHTML=`
        <div class="page-wrap">
          <section class="sheet">

              <colgroup>

                <col class="c-time">

                <tr>

                  <td colspan="4" class="head-value">${esc(client.name||'')}</td>
                  <td colspan="2" class="head-label">Aktenzeichen:</td>
                  <td class="head-value">${esc(client.aktenzeichen||'')}</td>
                </tr>

                <tr>
                  <td colspan="3" class="head-label">Leistungsanbieter (Name, Adresse)</td>
                  <td colspan="7" class="head-value">
                    ${esc(payload.leistungsanbieter||'SuPA GmbH, Königstraße 4, 30175 Hannover')}
                  </td>
                </tr>

                <tr>
                  <td colspan="3" class="head-label">Verantwortliche*r Auftragnehmer*in (Name, Vorname)</td>
                  <td colspan="7" class="head-value">${esc(payload.auftragnehmer||'')}</td>
                </tr>

                <tr>

                </tr>

                <tr>
                  <td colspan="3" class="head-label">

                  </td>

                  <td class="head-value-number">
                    ${weeklyFls!==''?formatFls(weeklyFls):''}
                  </td>

              </tbody>
            </table>

            <table class="ln-table">
              <colgroup>
                <col class="c-date">
                <col class="c-time">
                <col class="c-place">

              <tbody>${rows.join('')}</tbody>

              <tfoot>

                  <td class="number">${formatFls(totalFls)}</td>
                  <td></td>
                  <td class="number">${formatFls(totalWay)}</td>
                  <td class="center-text">${totalCancel}</td>
                  <td></td>
                  <td></td>
                </tr>
                                <tr class="sum-row">
                  <td colspan="3"></td>
                  <td>Summe Minuten</td>
                  <td>Summe FLS</td>
                  <td></td>
                  <td>Summe Wegepauschalen</td>
                  <td>Summe Ausfallstunden</td>

              <div>Datum</div>

              <div></div>

    async function erstellePdf(){
      const knopf=document.getElementById('pdfButton');
      const blatt=document.querySelector('.sheet');

      if(!blatt){
        alert('Es sind keine Daten zum Speichern vorhanden.');
        return;
      }

      if(typeof html2canvas==='undefined'||!window.jspdf){
        alert(
          'Die PDF-Funktion konnte nicht geladen werden. '+
          'Bitte die Internetverbindung prüfen und die Seite neu laden.'
        );
        return;
      }

      const beschriftung=knopf.textContent;
      knopf.disabled=true;
      knopf.textContent='PDF wird erstellt …';

      const rahmen=blatt.style.border;
      const schatten=blatt.style.boxShadow;

      blatt.style.border='0';
      blatt.style.boxShadow='none';

      try{
        const bild=await html2canvas(blatt,{
          scale:3,
          backgroundColor:'#ffffff',
          useCORS:true,
          logging:false
        });

        const {jsPDF}=window.jspdf;

        const pdf=new jsPDF({
          orientation:'landscape',
          unit:'mm',
          format:'a4'
        });

        const seiteBreite=pdf.internal.pageSize.getWidth();
        const seiteHoehe=pdf.internal.pageSize.getHeight();

        const rand=4;
        const nutzBreite=seiteBreite-rand*2;
        const nutzHoehe=seiteHoehe-rand*2;

        const verhaeltnis=bild.height/bild.width;

        let breite=nutzBreite;
        let hoehe=breite*verhaeltnis;

        if(hoehe>nutzHoehe){
          hoehe=nutzHoehe;
          breite=hoehe/verhaeltnis;
        }

        const x=(seiteBreite-breite)/2;

        pdf.addImage(
          bild.toDataURL('image/jpeg',0.95),
          'JPEG',
          x,
          rand,
          breite,
          hoehe
        );

        const payload=readPayload()||{};

        pdf.save(lnDateiname(payload,'.pdf'));
      }catch(fehler){
        alert('Das PDF konnte nicht erstellt werden: '+fehler.message);
      }finally{
        blatt.style.border=rahmen;
        blatt.style.boxShadow=schatten;

        knopf.disabled=false;
        knopf.textContent=beschriftung;
      }
    }

    /* ---------- Excel: offizielle SuPA-Vorlage ausfüllen ---------- */
    // Die Vorlage „Vorlage_Leistungsnachweis_SuPA_GmbH_ab_2026.xlsx" ist
    // weiter unten (LN_VORLAGE_B64) fest eingebettet. Eine .xlsx-Datei ist
    // ein ZIP-Archiv mit XML-Dateien. Die App öffnet das Archiv, setzt die
    // Werte in den Reiter „LN qualifizierte Assistenz" und packt es wieder
    // zusammen. Formate, Spaltenbreiten und Formeln der Vorlage bleiben so
    // vollständig erhalten. Es wird kein Zusatzprogramm aus dem Internet
    // geladen, und keine Daten verlassen das Gerät.

    const LN_ERSTE_ZEILE=13;   // erste Terminzeile der Vorlage
    const LN_LETZTE_ZEILE=34;  // letzte Terminzeile der Vorlage (22 Zeilen)
    const LN_MONATE=['Januar','Februar','März','April','Mai','Juni','Juli',
      'August','September','Oktober','November','Dezember'];

    function lnBase64ZuBytes(text){
      const roh=atob(text);
      const bytes=new Uint8Array(roh.length);
      for(let i=0;i<roh.length;i++)bytes[i]=roh.charCodeAt(i);
      return bytes;
    }

    async function lnEntpacken(daten){
      const stream=new Blob([daten]).stream()
        .pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    // ZIP-Archiv lesen: liefert eine Liste {name, daten}
    async function lnZipLesen(bytes){
      const sicht=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);
      let ende=-1;

      for(let i=bytes.length-22;i>=0;i--){
        if(sicht.getUint32(i,true)===0x06054b50){ende=i;break;}
      }

      if(ende<0)throw new Error('Vorlage ist kein gültiges Excel-Archiv.');

      const anzahl=sicht.getUint16(ende+10,true);
      let pos=sicht.getUint32(ende+16,true);
      const dekoder=new TextDecoder();
      const dateien=[];

      for(let n=0;n<anzahl;n++){
        if(sicht.getUint32(pos,true)!==0x02014b50){
          throw new Error('Vorlage beschädigt (Inhaltsverzeichnis).');
        }

        const methode=sicht.getUint16(pos+10,true);
        const groesse=sicht.getUint32(pos+20,true);
        const nameLaenge=sicht.getUint16(pos+28,true);
        const extraLaenge=sicht.getUint16(pos+30,true);
        const kommentarLaenge=sicht.getUint16(pos+32,true);
        const kopf=sicht.getUint32(pos+42,true);
        const name=dekoder.decode(bytes.subarray(pos+46,pos+46+nameLaenge));

        const lokalName=sicht.getUint16(kopf+26,true);
        const lokalExtra=sicht.getUint16(kopf+28,true);
        const start=kopf+30+lokalName+lokalExtra;
        const roh=bytes.subarray(start,start+groesse);

        let daten;
        if(methode===0)daten=roh.slice();
        else if(methode===8)daten=await lnEntpacken(roh);
        else throw new Error('Unbekannte Packmethode in der Vorlage.');

        dateien.push({name,daten});
        pos+=46+nameLaenge+extraLaenge+kommentarLaenge;
      }

      return dateien;
    }

    let LN_CRC_TABELLE=null;

    function lnCrc32(daten){
      if(!LN_CRC_TABELLE){
        LN_CRC_TABELLE=new Uint32Array(256);
        for(let n=0;n<256;n++){
          let c=n;
          for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;
          LN_CRC_TABELLE[n]=c>>>0;
        }
      }

      let crc=0xFFFFFFFF;
      for(let i=0;i<daten.length;i++){
        crc=LN_CRC_TABELLE[(crc^daten[i])&0xFF]^(crc>>>8);
      }
      return (crc^0xFFFFFFFF)>>>0;
    }

    // ZIP-Archiv schreiben (ungepackt gespeichert, das akzeptiert Excel)
    function lnZipSchreiben(dateien){
      const koder=new TextEncoder();
      const jetzt=new Date();
      const dosZeit=(jetzt.getHours()<<11)|(jetzt.getMinutes()<<5)|(jetzt.getSeconds()>>1);
      const dosDatum=((jetzt.getFullYear()-1980)<<9)|((jetzt.getMonth()+1)<<5)|jetzt.getDate();

      const teile=[];
      const verzeichnis=[];
      let versatz=0;

      for(const datei of dateien){
        const name=koder.encode(datei.name);
        const crc=lnCrc32(datei.daten);
        const groesse=datei.daten.length;

        const kopf=new DataView(new ArrayBuffer(30));
        kopf.setUint32(0,0x04034b50,true);
        kopf.setUint16(4,20,true);
        kopf.setUint16(6,0x0800,true);
        kopf.setUint16(8,0,true);
        kopf.setUint16(10,dosZeit,true);
        kopf.setUint16(12,dosDatum,true);
        kopf.setUint32(14,crc,true);
        kopf.setUint32(18,groesse,true);
        kopf.setUint32(22,groesse,true);
        kopf.setUint16(26,name.length,true);
        kopf.setUint16(28,0,true);

        teile.push(new Uint8Array(kopf.buffer),name,datei.daten);

        const eintrag=new DataView(new ArrayBuffer(46));
        eintrag.setUint32(0,0x02014b50,true);
        eintrag.setUint16(4,20,true);
        eintrag.setUint16(6,20,true);
        eintrag.setUint16(8,0x0800,true);
        eintrag.setUint16(10,0,true);
        eintrag.setUint16(12,dosZeit,true);
        eintrag.setUint16(14,dosDatum,true);
        eintrag.setUint32(16,crc,true);
        eintrag.setUint32(20,groesse,true);
        eintrag.setUint32(24,groesse,true);
        eintrag.setUint16(28,name.length,true);
        eintrag.setUint32(42,versatz,true);
        verzeichnis.push(new Uint8Array(eintrag.buffer),name);

        versatz+=30+name.length+groesse;
      }

      const verzeichnisGroesse=verzeichnis.reduce((s,t)=>s+t.length,0);
      const schluss=new DataView(new ArrayBuffer(22));
      schluss.setUint32(0,0x06054b50,true);
      schluss.setUint16(8,dateien.length,true);
      schluss.setUint16(10,dateien.length,true);
      schluss.setUint32(12,verzeichnisGroesse,true);
      schluss.setUint32(16,versatz,true);

      return new Blob([...teile,...verzeichnis,new Uint8Array(schluss.buffer)],{
        type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
    }

    function lnXml(text){
      return String(text??'')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
    }

    // Excel zählt Tage ab dem 30.12.1899
    function lnExcelDatum(iso){
      const [j,m,t]=String(iso||'').slice(0,10).split('-').map(Number);
      if(!j||!m||!t)return null;
      return Math.round((Date.UTC(j,m-1,t)-Date.UTC(1899,11,30))/86400000);
    }

    // Uhrzeit als Bruchteil eines Tages (12:00 = 0,5)
    function lnExcelZeit(zeit){
      const [h,min]=String(zeit||'').slice(0,5).split(':').map(Number);
      if(!Number.isFinite(h))return null;
      return (h*60+(min||0))/1440;
    }

    const lnZelle={
      leer:(ref,s)=>'<c r="'+ref+'" s="'+s+'"/>',
      zahl:(ref,s,wert)=>wert==null||wert===''||!Number.isFinite(Number(wert))
        ? lnZelle.leer(ref,s)
        : '<c r="'+ref+'" s="'+s+'"><v>'+Number(wert)+'</v></c>',
      text:(ref,s,wert)=>wert==null||String(wert)===''
        ? lnZelle.leer(ref,s)
        : '<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+
          lnXml(wert)+'</t></is></c>',
      formel:(ref,s,formel)=>'<c r="'+ref+'" s="'+s+'"><f>'+lnXml(formel)+'</f></c>'
    };

    function lnSpalteNr(buchstaben){
      let n=0;
      for(const z of buchstaben)n=n*26+(z.charCodeAt(0)-64);
      return n;
    }

    // Ersetzt eine einzelne Zelle (behält ihr Format) oder fügt sie ein
    function lnZelleSetzen(xml,ref,bauen){
      const zeilenNr=Number(ref.replace(/[A-Z]+/,''));
      const zeileMuster=new RegExp('<row r="'+zeilenNr+'"[^>]*?(?:/>|>[\\s\\S]*?</row>)');
      const zeileTreffer=xml.match(zeileMuster);

      if(!zeileTreffer)throw new Error('Zeile '+zeilenNr+' fehlt in der Vorlage.');

      let zeile=zeileTreffer[0];
      const zelleMuster=new RegExp('<c r="'+ref+'"(?:\\s[^>]*?)?(?:/>|>[\\s\\S]*?</c>)');
      const zelle=zeile.match(zelleMuster);

      if(zelle){
        const s=(zelle[0].match(/\ss="(\d+)"/)||[,'0'])[1];
        zeile=zeile.replace(zelle[0],bauen(ref,s));
      }else{
        const neu=bauen(ref,'0');
        const spalte=lnSpalteNr(ref.replace(/\d+/,''));
        let eingefuegt=false;

        zeile=zeile.replace(/<c r="([A-Z]+)\d+"/g,(treffer,buchstaben)=>{
          if(!eingefuegt&&lnSpalteNr(buchstaben)>spalte){
            eingefuegt=true;
            return neu+treffer;
          }
          return treffer;
        });

        if(!eingefuegt){
          zeile=zeile.endsWith('/>')
            ? zeile.slice(0,-2)+'>'+neu+'</row>'
            : zeile.replace('</row>',neu+'</row>');
        }
      }

      return xml.replace(zeileTreffer[0],zeile);
    }

    function lnZeilenFormate(xml,zeilenNr){
      const zeile=xml.match(new RegExp('<row r="'+zeilenNr+'"[^>]*>([\\s\\S]*?)</row>'));
      const formate={};
      if(zeile){
        zeile[1].replace(/<c r="([A-Z]+)\d+" s="(\d+)"/g,(_,sp,s)=>{formate[sp]=s;});
      }
      return formate;
    }

    function lnBlattFuellen(xml,payload){
      const client=payload.client||{};
      const approval=payload.approval||{};
      const entries=payload.entries||[];
      const auftragnehmer=payload.auftragnehmer||'';

      const plaetze=LN_LETZTE_ZEILE-LN_ERSTE_ZEILE+1;
      const extra=Math.max(0,entries.length-plaetze);
      const letzte=LN_LETZTE_ZEILE+extra;

      // Formate der Terminzeilen aus der Vorlage merken
      const formate={};
      for(let r=LN_ERSTE_ZEILE;r<=LN_LETZTE_ZEILE;r++){
        formate[r]=lnZeilenFormate(xml,r);
      }

      // Zwischengespeicherte Rechenergebnisse entfernen,
      // Excel rechnet beim Öffnen alles neu.
      xml=xml.replace(/(<f[^>]*\/>|<f[^>]*>[^<]*<\/f>)<v>[^<]*<\/v>/g,'$1');

      // Kopfbereich
      const provider=
        approval.kostentraeger||
        approval.leistungstraeger_name||
        approval.leistungstraeger_typ||
        '';

      const weeklyFls=
        approval.wochen_fls??
        approval.fls_pro_woche??
        approval.wochenstunden??
        '';

      const [monatName,jahr]=String(payload.monthLabel||'').split(' ');

      xml=lnZelleSetzen(xml,'D3',(r,s)=>lnZelle.text(r,s,client.name||''));
      xml=lnZelleSetzen(xml,'J3',(r,s)=>lnZelle.text(r,s,client.aktenzeichen||''));
      xml=lnZelleSetzen(xml,'D4',(r,s)=>lnZelle.text(r,s,
        payload.leistungsanbieter||'SuPA GmbH, Königstraße 4, 30175 Hannover'));
      xml=lnZelleSetzen(xml,'D5',(r,s)=>lnZelle.text(r,s,auftragnehmer));
      xml=lnZelleSetzen(xml,'D6',(r,s)=>lnZelle.text(r,s,provider));
      xml=lnZelleSetzen(xml,'E7',(r,s)=>lnZelle.zahl(r,s,weeklyFls));
      xml=lnZelleSetzen(xml,'E8',(r,s)=>lnZelle.zahl(r,s,lnExcelDatum(approval.beginn)));
      xml=lnZelleSetzen(xml,'B11',(r,s)=>lnZelle.text(r,s,monatName||''));
      xml=lnZelleSetzen(xml,'C11',(r,s)=>lnZelle.zahl(r,s,jahr?Number(jahr):''));

      // Nachfolgende Zeilen (Summen, Unterschrift) nach unten verschieben,
      // falls mehr als 22 Termine im Monat sind.
      const verschiebeRef=formel=>formel.replace(
        /(\$?[A-Z]{1,3}\$?)(\d+)(?![\d(])/g,
        (treffer,spalte,zahl)=>{
          const n=Number(zahl);
          if(n===LN_LETZTE_ZEILE)return spalte+letzte;
          if(n>LN_LETZTE_ZEILE)return spalte+(n+extra);
          return treffer;
        }
      );

      if(extra){
        xml=xml.replace(/<row r="(\d+)"([^>]*?)(\/>|>([\s\S]*?)<\/row>)/g,(zeile,nr,attr,rest,innen)=>{
          const n=Number(nr);
          if(n<=LN_LETZTE_ZEILE)return zeile;

          const neuNr=n+extra;
          let inhalt=(innen||'')
            .replace(/<c r="([A-Z]+)\d+"/g,'<c r="$1'+neuNr+'"');

          return '<row r="'+neuNr+'"'+attr+
            (innen===undefined?'/>':'>'+inhalt+'</row>');
        });

        xml=xml.replace(/<dimension ref="([A-Z]+\d+):([A-Z]+)(\d+)"\/>/,
          (_,a,sp,n)=>'<dimension ref="'+a+':'+sp+(Number(n)+extra)+'"/>');
      }

      // Formeln außerhalb der Terminzeilen anpassen (Summen, Restbudget)
      xml=xml.replace(/<row r="(\d+)"([^>]*?)(\/>|>([\s\S]*?)<\/row>)/g,(zeile,nr,attr,rest,innen)=>{
        const n=Number(nr);
        if(innen===undefined)return zeile;
        if(n>=LN_ERSTE_ZEILE&&n<=letzte)return zeile;
        return '<row r="'+nr+'"'+attr+'>'+
          innen.replace(/<f>([^<]*)<\/f>/g,(_,f)=>'<f>'+verschiebeRef(f)+'</f>')+
          '</row>';
      });

      // Dropdown für die Kennziffer auf alle Terminzeilen ausdehnen
      xml=xml.replace(/<xm:sqref>I13:I\d+<\/xm:sqref>/,'<xm:sqref>I13:I'+letzte+'</xm:sqref>');

      // Terminzeilen komplett neu schreiben
      const zeilen=[];

      for(let i=0;i<plaetze+extra;i++){
        const r=LN_ERSTE_ZEILE+i;
        const vorlageZeile=r===letzte
          ? LN_LETZTE_ZEILE
          : Math.min(r,LN_LETZTE_ZEILE-1);
        const f=formate[vorlageZeile];
        const e=entries[i];
        const z=sp=>sp+r;

        let zellen;

        if(e){
          const minuten=Number(e.dauer_minuten||0);
          const fls=eintragFls(e);
          const formelFls=Math.round((minuten/50)*100)/100;
          const kennziffer=String(e.kennziffer||'').trim();

          zellen=[
            lnZelle.zahl(z('A'),f.A,lnExcelDatum(e.datum)),
            lnZelle.zahl(z('B'),f.B,lnExcelZeit(e.beginn)),
            lnZelle.text(z('C'),f.C,e.ort_der_leistung||''),
            lnZelle.zahl(z('D'),f.D,minuten),
            // Gleicher Wert wie die Vorlagen-Formel: Formel behalten,
            // sonst den in der App gespeicherten FLS-Wert eintragen.
            Math.abs(fls-formelFls)<0.0001
              ? lnZelle.formel(z('E'),f.E,'ROUND($D'+r+'/50,2)')
              : lnZelle.zahl(z('E'),f.E,fls),
            hatWegepauschale(e)?lnZelle.zahl(z('F'),f.F,1):lnZelle.leer(z('F'),f.F),
            lnZelle.formel(z('G'),f.G,'F'+r),
            istAusfall(e)?lnZelle.zahl(z('H'),f.H,1):lnZelle.leer(z('H'),f.H),
            /^\d+$/.test(kennziffer)
              ? lnZelle.zahl(z('I'),f.I,Number(kennziffer))
              : lnZelle.text(z('I'),f.I,kennziffer),
            lnZelle.text(z('J'),f.J,auftragnehmer)
          ];
        }else{
          zellen=[
            lnZelle.leer(z('A'),f.A),
            lnZelle.leer(z('B'),f.B),
            lnZelle.leer(z('C'),f.C),
            lnZelle.leer(z('D'),f.D),
            lnZelle.formel(z('E'),f.E,'ROUND($D'+r+'/50,2)'),
            lnZelle.leer(z('F'),f.F),
            lnZelle.formel(z('G'),f.G,'F'+r),
            lnZelle.leer(z('H'),f.H),
            lnZelle.leer(z('I'),f.I),
            lnZelle.leer(z('J'),f.J)
          ];
        }

        zeilen.push('<row r="'+r+'" spans="1:14" x14ac:dyDescent="0.3">'+zellen.join('')+'</row>');
      }

      // Alte Terminzeilen 13–34 durch die neuen ersetzen
      const anfang=xml.search(new RegExp('<row r="'+LN_ERSTE_ZEILE+'"[ >]'));
      const endeTreffer=xml.match(new RegExp('<row r="'+LN_LETZTE_ZEILE+'"[^>]*>[\\s\\S]*?</row>'));

      if(anfang<0||!endeTreffer)throw new Error('Terminbereich in der Vorlage nicht gefunden.');

      const ende=xml.indexOf(endeTreffer[0])+endeTreffer[0].length;

      return xml.slice(0,anfang)+zeilen.join('')+xml.slice(ende);
    }

    async function lnExcelErstellen(payload){
      if(typeof DecompressionStream==='undefined'){
        throw new Error(
          'Dieses Gerät unterstützt die Excel-Erstellung nicht. '+
          'Bitte iPadOS bzw. iOS auf mindestens Version 16.4 aktualisieren.'
        );
      }

      const dateien=await lnZipLesen(lnBase64ZuBytes(LN_VORLAGE_B64));
      const dekoder=new TextDecoder();
      const koder=new TextEncoder();
      const ergebnis=[];

      for(const datei of dateien){
        // Die Rechenreihenfolge der Vorlage passt nicht mehr: weglassen,
        // Excel legt sie beim Öffnen neu an.
        if(datei.name==='xl/calcChain.xml')continue;

        let daten=datei.daten;

        if(datei.name==='xl/worksheets/sheet1.xml'){
          daten=koder.encode(lnBlattFuellen(dekoder.decode(daten),payload));
        }else if(datei.name==='xl/workbook.xml'){
          daten=koder.encode(dekoder.decode(daten).replace(
            /<calcPr([^>]*?)\/>/,
            (_,attr)=>'<calcPr'+attr.replace(/\sfullCalcOnLoad="[^"]*"/,'')+' fullCalcOnLoad="1"/>'
          ));
        }else if(datei.name==='[Content_Types].xml'){
          daten=koder.encode(dekoder.decode(daten)
            .replace(/<Override PartName="\/xl\/calcChain\.xml"[^>]*\/>/,''));
        }else if(datei.name==='xl/_rels/workbook.xml.rels'){
          daten=koder.encode(dekoder.decode(daten)
            .replace(/<Relationship [^>]*Target="calcChain\.xml"[^>]*\/>/,''));
        }

        ergebnis.push({name:datei.name,daten});
      }

      return lnZipSchreiben(ergebnis);
    }

    // Dateiname für Excel und PDF: „LN Nachname MM-JJJJ"
    // z. B. „LN Thiele 10-2026.xlsx"
    function lnDateiname(payload,endung){
      const name=(payload.client&&payload.client.name)||'';
      const nachname=name.split(',')[0].trim()||'Klient';

      const [monatName,jahr]=String(payload.monthLabel||'').split(' ');
      const monatNr=LN_MONATE.indexOf(monatName)+1;
      const zeitraum=monatNr&&jahr
        ? String(monatNr).padStart(2,'0')+'-'+jahr
        : String(payload.monthLabel||'').replace(/\s+/g,'-');

      return ('LN '+nachname+' '+zeitraum)
        .replace(/[^a-zA-Z0-9äöüÄÖÜß .-]/g,'')
        .replace(/\s+/g,' ')
        .trim()+endung;
    }

    // Die Datei wird schon beim Öffnen der Seite vorbereitet. So kann
    // der Knopf sofort das Teilen-Menü öffnen (Safari erlaubt das nur
    // unmittelbar nach dem Antippen).
    let lnExcelVorbereitung=null;

    function lnExcelVorbereiten(){
      const payload=readPayload();
      if(!payload)return null;

      lnExcelVorbereitung=lnExcelErstellen(payload).then(blob=>({
        datei:new File([blob],lnDateiname(payload,'.xlsx'),{type:blob.type}),
        fehler:null
      })).catch(fehler=>({datei:null,fehler}));

      lnExcelVorbereitung.then(ergebnis=>{
        if(ergebnis&&ergebnis.datei)lnExcelFertig=ergebnis;
      });

      return lnExcelVorbereitung;
    }

    function lnHerunterladen(datei){
      const adresse=URL.createObjectURL(datei);
      const verweis=document.createElement('a');
      verweis.href=adresse;
      verweis.download=datei.name;
      document.body.appendChild(verweis);
      verweis.click();
      verweis.remove();
      setTimeout(()=>URL.revokeObjectURL(adresse),60000);
    }

    let lnExcelFertig=null;

    async function excelSpeichern(){
      const knopf=document.getElementById('excelButton');

      // Bereits fertig: ohne Wartezeit teilen
      if(lnExcelFertig&&lnExcelFertig.datei){
        const datei=lnExcelFertig.datei;

        if(navigator.canShare&&navigator.canShare({files:[datei]})){
          try{
            await navigator.share({files:[datei],title:datei.name});
            return;
          }catch(fehler){
            if(fehler&&fehler.name==='AbortError')return;
            // Teilen nicht erlaubt: auf Herunterladen ausweichen
          }
        }

        lnHerunterladen(datei);
        return;
      }

      const beschriftung=knopf.textContent;
      knopf.disabled=true;
      knopf.textContent='Excel wird erstellt …';

      try{
        lnExcelFertig=await (lnExcelVorbereitung||lnExcelVorbereiten());
        if(!lnExcelFertig)throw new Error('Es sind keine Daten vorhanden.');
        if(lnExcelFertig.fehler)throw lnExcelFertig.fehler;

        knopf.textContent='Excel öffnen / teilen';
        knopf.classList.add('primary');
        alert('Die Excel-Datei ist fertig. Bitte noch einmal auf „Excel öffnen / teilen" tippen.');
        return;
      }catch(fehler){
        lnExcelFertig=null;
        lnExcelVorbereitung=null;
        alert('Die Excel-Datei konnte nicht erstellt werden: '+fehler.message);
        knopf.textContent=beschriftung;
      }finally{
        knopf.disabled=false;
      }
    }

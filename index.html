<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leistungsnachweis">
<title>Leistungsnachweis</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#17324d;--muted:#657789;--line:#d8e1e8;--bg:#f3f6f9;--card:#fff;--accent:#e7f1f7;--danger:#9d3030;--success:#2f6f4e}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.wrap{max-width:900px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(23,50,77,.07);margin-bottom:14px}
.center{max-width:480px;margin:8vh auto}
h1,h2,h3{margin:.2em 0 .5em}
p{line-height:1.45}
label{display:flex;flex-direction:column;gap:6px;font-weight:650;margin:12px 0}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
textarea{resize:vertical}
.primary,.secondary,.danger{border:0;border-radius:12px;padding:12px 15px}
.primary{background:var(--ink);color:#fff}
.secondary{background:var(--accent);color:var(--ink)}
.danger{background:#fae8e8;color:var(--danger)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted)}
.client{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.client+.client{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.meta{font-size:.9rem;color:var(--muted)}
dialog{width:min(94vw,700px);border:0;border-radius:20px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(15,30,45,.45)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span2{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.approval{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.approval-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.approval-hours{font-weight:750;color:var(--success)}
.small{font-size:.88rem}
@media(max-width:650px){
  .grid{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .client,.approval-head{flex-direction:column}
  .client .actions,.approval-head .actions{width:100%}
}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<section id="auth" class="wrap center">
  <div class="card">
    <h1>Leistungsnachweis</h1>
    <p class="muted">Melde dich mit deinem App-Konto an.</p>
    <label>E-Mail<input id="email" type="email" autocomplete="email"></label>
    <label>Passwort<input id="password" type="password" autocomplete="current-password"></label>
    <div class="actions">
      <button id="login" class="primary">Anmelden</button>
      <button id="signup" class="secondary">Registrieren</button>
    </div>
  </div>
</section>

<section id="app" class="wrap hidden">
  <div class="card top">
    <div><div class="muted">Mobile Verwaltung</div><h1>Klienten</h1></div>
    <button id="logout" class="secondary">Abmelden</button>
  </div>

  <div class="card">
    <div class="top">
      <div><h2>Klientenliste</h2><p class="muted">Die Daten werden in deinem Supabase-Projekt gespeichert.</p></div>
      <button id="newClient" class="primary">+ Neuer Klient</button>
    </div>
    <div id="list"></div>
  </div>
</section>

<dialog id="clientDialog">
  <form id="clientForm">
    <div class="top">
      <h2 id="dialogTitle">Klient anlegen</h2>
      <button type="button" id="closeDialog" class="secondary">Schließen</button>
    </div>
    <input type="hidden" id="clientId">
    <div class="grid">
      <label>Klienten-ID<input id="clientCode" required placeholder="K0001"></label>
      <label>Name, Vorname<input id="clientName" required></label>
      <label>Aktenzeichen<input id="aktenzeichen"></label>
      <label>Geburtstag<input id="geburtstag" type="date"></label>
      <label>Telefon<input id="telefon" type="tel"></label>
      <label>Mobil<input id="mobil" type="tel"></label>
      <label>Straße<input id="strasse"></label>
      <label>Hausnummer<input id="hausnummer"></label>
      <label>PLZ<input id="plz"></label>
      <label>Ort<input id="ort"></label>
      <label>Kontaktperson 1<input id="kontaktperson1"></label>
      <label>Telefon Kontakt 1<input id="telefon1"></label>
      <label>Kontaktperson 2<input id="kontaktperson2"></label>
      <label>Telefon Kontakt 2<input id="telefon2"></label>
      <label class="span2">Bemerkungen<textarea id="bemerkungen" rows="3"></textarea></label>
    </div>
    <div class="actions">
      <button type="button" id="deleteClient" class="danger hidden">Löschen</button>
      <button type="submit" class="primary">Speichern</button>
    </div>
  </form>
</dialog>
<dialog id="docsDialog">
  <div class="top">
    <div>
      <div class="muted">Dokumentationen</div>
      <h2 id="docsClientName"></h2>
    </div>
    <button id="closeDocs" class="secondary">Schließen</button>
  </div>

  <div class="actions" style="margin:16px 0">
    <button id="newDoc" class="primary">+ Neue Dokumentation</button>
  </div>

  <div id="docsList">
    <p class="muted">Noch keine Dokumentationen vorhanden.</p>
  </div>
</dialog>
<dialog id="approvalsDialog">
  <div class="top">
    <div>
      <div class="muted">Klientenakte</div>
      <h2 id="approvalsClientName">Bewilligungen</h2>
    </div>
    <button type="button" id="closeApprovals" class="secondary">Schließen</button>
  </div>

  <div class="actions">
    <button type="button" id="newApproval" class="primary">+ Neue Bewilligung</button>
  </div>

  <div id="approvalsList"></div>
</dialog>

<dialog id="approvalFormDialog">
  <form id="approvalForm">
    <div class="top">
      <h2 id="approvalDialogTitle">Bewilligung anlegen</h2>
      <button type="button" id="closeApprovalForm" class="secondary">Schließen</button>
    </div>

    <input type="hidden" id="approvalId">

    <div class="grid">
      <label>Beginn<input id="approvalBeginn" type="date" required></label>
      <label>Ende<input id="approvalEnde" type="date" required></label>
<label>Gesamt-FLS<input id="approvalStunden" type="number" min="0" step="0.01" inputmode="decimal" required></label>
<label>Wochen-FLS<input id="approvalWochenFls" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label>
  Leistungsträger
  <select id="approvalLeistungstraegerTyp">
    <option value="">Bitte auswählen</option>
    <option value="LH Hannover">LH Hannover</option>
    <option value="Region Hannover">Region Hannover</option>
    <option value="Sonstiger Leistungsträger">Sonstiger Leistungsträger</option>
  </select>
</label>

<label id="approvalLeistungstraegerNameWrap" class="hidden">
  Name des sonstigen Leistungsträgers
  <input id="approvalLeistungstraegerName" placeholder="z. B. Stadt Peine">
</label>
      <label>Ansprechpartner<input id="approvalAnsprechpartner"></label>
      <label class="span2">Bemerkungen<textarea id="approvalBemerkungen" rows="3"></textarea></label>
    </div>

    <div class="actions">
      <button type="button" id="deleteApproval" class="danger hidden">Löschen</button>
      <button type="submit" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<script>
const SUPABASE_URL='https://bhrygputoysiwchzlygn.supabase.co';
const SUPABASE_KEY='sb_publishable_6l1Zi_OcdlxKQgvJWhZWYQ_ZOn6_j1C';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);

let user=null;
let clients=[];
let approvals=[];
let activeClient=null;

function toast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2300);
}

function esc(v=''){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function showApp(on){
  $('auth').classList.toggle('hidden',on);
  $('app').classList.toggle('hidden',!on);
}

function formatDate(value){
  if(!value)return '';
  const [y,m,d]=value.split('-');
  return `${d}.${m}.${y}`;
}

function formatHours(value){
  return new Intl.NumberFormat('de-DE',{
    minimumFractionDigits:0,
    maximumFractionDigits:2
  }).format(Number(value||0));
}

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    user=session.user;
    showApp(true);
    await loadClients();
  }else{
    showApp(false);
  }
}

async function loadClients(){
  const {data,error}=await sb.from('clients').select('*').order('name');
  if(error){
    toast(error.message);
    return;
  }

  clients=data||[];

  $('list').innerHTML=clients.length?clients.map(c=>`
    <div class="client">
      <div>
        <h3>${esc(c.name)}</h3>
        <div class="meta">${esc(c.client_code)} · ${esc(c.aktenzeichen||'kein Aktenzeichen')}</div>
        <div class="meta">${esc([c.strasse,c.hausnummer,c.plz,c.ort].filter(Boolean).join(' '))}</div>
      </div>
<div class="actions">
  <button class="secondary docs" data-id="${c.id}">Dokumentation</button>
  <button class="secondary approvals" data-id="${c.id}">Bewilligungen</button>
  <button class="secondary edit" data-id="${c.id}">Bearbeiten</button>
</div>
    </div>
  `).join(''):'<p class="muted">Noch keine Klienten angelegt.</p>';

  document.querySelectorAll('.edit').forEach(
  b => b.onclick = () => openClient(b.dataset.id)
);

document.querySelectorAll('.docs').forEach(
  b => b.onclick = () => {
    toast('Dokumentationsmodul folgt im nächsten Schritt.');
  }
);

  document.querySelectorAll('.approvals').forEach(
    b=>b.onclick=()=>openApprovals(b.dataset.id)
  );
}

function openClient(id=''){
  const c=clients.find(x=>x.id===id)||{};

  $('clientId').value=c.id||'';
  $('clientCode').value=c.client_code||'';
  $('clientName').value=c.name||'';
  $('aktenzeichen').value=c.aktenzeichen||'';
  $('geburtstag').value=c.geburtstag||'';
  $('telefon').value=c.telefon||'';
  $('mobil').value=c.mobil||'';
  $('strasse').value=c.strasse||'';
  $('hausnummer').value=c.hausnummer||'';
  $('plz').value=c.plz||'';
  $('ort').value=c.ort||'';
  $('kontaktperson1').value=c.kontaktperson1||'';
  $('telefon1').value=c.telefon1||'';
  $('kontaktperson2').value=c.kontaktperson2||'';
  $('telefon2').value=c.telefon2||'';
  $('bemerkungen').value=c.bemerkungen||'';

  $('deleteClient').classList.toggle('hidden',!id);
  $('dialogTitle').textContent=id?'Klient bearbeiten':'Klient anlegen';
  $('clientDialog').showModal();
}

async function openApprovals(clientId){
  activeClient=clients.find(c=>c.id===clientId)||null;
  if(!activeClient){
    toast('Klient nicht gefunden.');
    return;
  }

  $('approvalsClientName').textContent=activeClient.name;
  $('approvalsDialog').showModal();
  await loadApprovals();
}

async function loadApprovals(){
  if(!activeClient)return;

  $('approvalsList').innerHTML='<p class="muted">Bewilligungen werden geladen …</p>';

  const {data,error}=await sb
    .from('bewilligungen')
    .select('*')
    .eq('client_id',activeClient.id)
    .order('beginn',{ascending:false});

  if(error){
    $('approvalsList').innerHTML='';
    toast(error.message);
    return;
  }

  approvals=data||[];

  $('approvalsList').innerHTML=approvals.length?approvals.map(a=>`
    <div class="approval">
      <div class="approval-head">
        <div>
          <h3>${formatDate(a.beginn)} – ${formatDate(a.ende)}</h3>
<div class="approval-hours">${formatHours(a.stundenkontingent)} Gesamt-FLS</div>
<div class="meta">${a.wochen_fls!=null ? formatHours(a.wochen_fls)+' Wochen-FLS' : 'keine Wochen-FLS eingetragen'}</div>
          <div class="meta">${esc(a.kostentraeger||'kein Kostenträger')}</div>
          ${a.ansprechpartner?`<div class="meta">Ansprechpartner: ${esc(a.ansprechpartner)}</div>`:''}
          ${a.bemerkungen?`<p class="small">${esc(a.bemerkungen)}</p>`:''}
        </div>
        <div class="actions">
          <button class="secondary editApproval" data-id="${a.id}">Bearbeiten</button>
        </div>
      </div>
    </div>
  `).join(''):'<p class="muted">Noch keine Bewilligungen angelegt.</p>';

  document.querySelectorAll('.editApproval').forEach(
    b=>b.onclick=()=>openApprovalForm(b.dataset.id)
  );
}

  function updateLeistungstraegerFields(){
  const isOther=$('approvalLeistungstraegerTyp').value==='Sonstiger Leistungsträger';

  $('approvalLeistungstraegerNameWrap').classList.toggle('hidden',!isOther);
  $('approvalLeistungstraegerName').required=isOther;

  if(!isOther){
    $('approvalLeistungstraegerName').value='';
  }
}
function openApprovalForm(id=''){
  const a=approvals.find(x=>x.id===id)||{};

  $('approvalId').value=a.id||'';
  $('approvalBeginn').value=a.beginn||'';
  $('approvalEnde').value=a.ende||'';
  $('approvalStunden').value=a.stundenkontingent??'';
  $('approvalWochenFls').value=a.wochen_fls??'';
$('approvalLeistungstraegerTyp').value=a.leistungstraeger_typ||'';
$('approvalLeistungstraegerName').value=a.leistungstraeger_name||'';
updateLeistungstraegerFields();
  $('approvalAnsprechpartner').value=a.ansprechpartner||'';
  $('approvalBemerkungen').value=a.bemerkungen||'';

  $('deleteApproval').classList.toggle('hidden',!id);
  $('approvalDialogTitle').textContent=id?'Bewilligung bearbeiten':'Bewilligung anlegen';
  $('approvalFormDialog').showModal();
}

  $('approvalLeistungstraegerTyp').onchange = updateLeistungstraegerFields;
$('login').onclick=async()=>{
  const {error}=await sb.auth.signInWithPassword({
    email:$('email').value,
    password:$('password').value
  });

  if(error){
    toast(error.message);
    return;
  }

  await init();
};

$('signup').onclick=async()=>{
  const {data,error}=await sb.auth.signUp({
    email:$('email').value,
    password:$('password').value
  });

  if(error){
    toast(error.message);
    return;
  }

  if(data.session){
    toast('Registrierung erfolgreich.');
    await init();
  }else{
    toast('Registrierung angelegt. Bitte E-Mail bestätigen.');
  }
};

$('logout').onclick=async()=>{
  const button=$('logout');
  button.disabled=true;

  const {error}=await sb.auth.signOut({scope:'local'});

  if(error){
    toast('Abmelden fehlgeschlagen: '+error.message);
    button.disabled=false;
    return;
  }

  user=null;
  clients=[];
  approvals=[];
  activeClient=null;
  $('list').innerHTML='';
  showApp(false);
  toast('Du wurdest abgemeldet.');
  button.disabled=false;
};

$('newClient').onclick=()=>openClient();
$('closeDialog').onclick=()=>$('clientDialog').close();

$('clientForm').onsubmit=async e=>{
  e.preventDefault();

  const id=$('clientId').value;
  const row={
    user_id:user.id,
    client_code:$('clientCode').value.trim(),
    name:$('clientName').value.trim(),
    aktenzeichen:$('aktenzeichen').value.trim()||null,
    geburtstag:$('geburtstag').value||null,
    telefon:$('telefon').value.trim()||null,
    mobil:$('mobil').value.trim()||null,
    strasse:$('strasse').value.trim()||null,
    hausnummer:$('hausnummer').value.trim()||null,
    plz:$('plz').value.trim()||null,
    ort:$('ort').value.trim()||null,
    kontaktperson1:$('kontaktperson1').value.trim()||null,
    telefon1:$('telefon1').value.trim()||null,
    kontaktperson2:$('kontaktperson2').value.trim()||null,
    telefon2:$('telefon2').value.trim()||null,
    bemerkungen:$('bemerkungen').value.trim()||null
  };

  const q=id
    ? sb.from('clients').update(row).eq('id',id)
    : sb.from('clients').insert(row);

  const {error}=await q;

  if(error){
    toast(error.message);
    return;
  }

  $('clientDialog').close();
  toast('Gespeichert');
  await loadClients();
};

$('deleteClient').onclick=async()=>{
  const id=$('clientId').value;
  if(!id||!confirm('Diesen Klienten wirklich löschen?'))return;

  const {error}=await sb.from('clients').delete().eq('id',id);

  if(error){
    toast(error.message);
    return;
  }

  $('clientDialog').close();
  toast('Gelöscht');
  await loadClients();
};

$('closeApprovals').onclick=()=>{
  $('approvalsDialog').close();
  activeClient=null;
  approvals=[];
};

$('newApproval').onclick=()=>openApprovalForm();
$('closeApprovalForm').onclick=()=>$('approvalFormDialog').close();

$('approvalForm').onsubmit=async e=>{
  e.preventDefault();

  if(!activeClient){
    toast('Kein Klient ausgewählt.');
    return;
  }

  const id=$('approvalId').value;
  const row={
    user_id:user.id,
    client_id:activeClient.id,
    beginn:$('approvalBeginn').value,
    ende:$('approvalEnde').value,
    stundenkontingent:Number(String($('approvalStunden').value).replace(',','.')),
    wochen_fls:$('approvalWochenFls').value
  ? Number(String($('approvalWochenFls').value).replace(',','.'))
  : null,
leistungstraeger_typ:$('approvalLeistungstraegerTyp').value||null,
leistungstraeger_name:
  $('approvalLeistungstraegerTyp').value==='Sonstiger Leistungsträger'
    ? $('approvalLeistungstraegerName').value.trim()||null
    : null,
kostentraeger:
  $('approvalLeistungstraegerTyp').value==='Sonstiger Leistungsträger'
    ? $('approvalLeistungstraegerName').value.trim()||null
    : $('approvalLeistungstraegerTyp').value||null,
    ansprechpartner:$('approvalAnsprechpartner').value.trim()||null,
    bemerkungen:$('approvalBemerkungen').value.trim()||null
  };

  if(row.ende<row.beginn){
    toast('Das Enddatum darf nicht vor dem Beginn liegen.');
    return;
  }

  const q=id
    ? sb.from('bewilligungen').update(row).eq('id',id)
    : sb.from('bewilligungen').insert(row);

  const {error}=await q;

  if(error){
    toast(error.message);
    return;
  }

  $('approvalFormDialog').close();
  toast('Bewilligung gespeichert');
  await loadApprovals();
};

$('deleteApproval').onclick=async()=>{
  const id=$('approvalId').value;
  if(!id||!confirm('Diese Bewilligung wirklich löschen?'))return;

  const {error}=await sb.from('bewilligungen').delete().eq('id',id);

  if(error){
    toast(error.message);
    return;
  }

  $('approvalFormDialog').close();
  toast('Bewilligung gelöscht');
  await loadApprovals();
};

sb.auth.onAuthStateChange((_event,session)=>{
  if(session){
    user=session.user;
  }else{
    user=null;
    showApp(false);
  }
});

init();
</script>
</body>
</html>

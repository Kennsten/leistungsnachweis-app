# Supabase-Einstellungen der App (nur für die Edge Functions nötig).
# Die Anmeldung wird in der Function selbst geprüft (Bearer-Token an
# /auth/v1/user), weil die neuen "publishable"-Schlüssel nicht vom
# Standard-JWT-Prüfer des Gateways verstanden werden.
[functions.pcloud-link]
verify_jwt = false
